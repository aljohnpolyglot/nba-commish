<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBGM Ratings → Stats Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        #drop-zone {
            width: 80%;
            max-width: 600px;
            height: 300px;
            border: 3px dashed #e29a4a;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #drop-zone.hover {
            background: #fff1e1;
            border-color: #bd7a35;
            transform: scale(1.02);
        }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; }
        .status { margin-top: 20px; font-weight: bold; color: #2ecc71; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

    <h1>BBGM Ratings → Stats</h1>
    <p>Inverse of statstobbgm.html. Drop a BBGM-shaped JSON (players[].ratings[0]) to synthesize a realistic stat line.</p>

    <div id="drop-zone">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#e29a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <p>Drop JSON file here</p>
    </div>

    <div id="status" class="status"></div>

    <script>
        // League averages — same anchor points as statstobbgm.html.
        const L_3P_AVG = 33.7;
        const L_FG_AVG = 44.8;
        const L_FT_AVG = 73.5;

        const dropZone = document.getElementById('drop-zone');
        const status = document.getElementById('status');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('hover'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('hover'), false);
        });
        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const file = e.dataTransfer.files[0];
            if (file && (file.type === "application/json" || file.name.endsWith('.json'))) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        processData(JSON.parse(ev.target.result), file.name);
                    } catch (err) {
                        showError("Invalid JSON file.");
                        console.error(err);
                    }
                };
                reader.readAsText(file);
            } else {
                showError("Please drop a valid JSON file.");
            }
        }

        // Clamp into a plausible per-game range. floor/ceil tuned to NBA real-world envelopes.
        function clampStat(val, low, high) {
            if (!isFinite(val)) return low;
            return Math.max(low, Math.min(high, val));
        }

        // Inverse of calculateRatings. Forward formulas live in statstobbgm.html.
        // Assumes gpWeight=1 (full season) — i.e. ratings are taken at face value
        // rather than blended with a small-sample floor.
        function calculateStats(ratings, hgtIn, pos) {
            // hgtRating and valueWeight come from the forward physicals block.
            const hgtRating = (hgtIn - 67) * 4.1;
            // mpg from endu: forward says endu = mpg/30 * 95.
            const mpg = clampStat((ratings.endu ?? 50) * 30 / 95, 8, 40);
            const valueWeight = Math.min(1, mpg / 22);

            // ── stl from spd (position-branched) ───────────────────────────
            // Forward:  spd_G = 52 + stl*10 + vw*10
            //           spd_F = 38 + stl*5  + vw*10
            //           spd_C = 22 + stl*3  + vw*5
            let stl;
            const spd = ratings.spd ?? 50;
            if (pos.includes('G'))      stl = (spd - 52 - valueWeight * 10) / 10;
            else if (pos.includes('F')) stl = (spd - 38 - valueWeight * 10) / 5;
            else                        stl = (spd - 22 - valueWeight * 5)  / 3;
            stl = clampStat(stl, 0.1, 3.5);

            // ── blk from diq ───────────────────────────────────────────────
            // Forward: diq = 22 + stl*16 + blk*22
            const blk = clampStat(((ratings.diq ?? 50) - 22 - stl * 16) / 22, 0.0, 4.0);

            // ── apg from pss ───────────────────────────────────────────────
            // Forward: pss = apg * 10.5
            const apg = clampStat((ratings.pss ?? 50) / 10.5, 0.3, 12);

            // ── trb from reb (height-adjusted) ─────────────────────────────
            // Forward: reb = trb*5.2 + hgtRating*0.18
            const trb = clampStat(((ratings.reb ?? 50) - hgtRating * 0.18) / 5.2, 1, 16);

            // ── ppg from oiq + apg ─────────────────────────────────────────
            // Forward: oiq = 22 + ppg*2.4 + apg*2  → ppg = (oiq - 22 - apg*2) / 2.4
            const ppg = clampStat(((ratings.oiq ?? 50) - 22 - apg * 2) / 2.4, 1, 36);

            // ── fgp from ins + ppg ─────────────────────────────────────────
            // Forward: ins = 22 + ppg*1.7 + (fgp - 44.8)  → fgp = ins - 22 - ppg*1.7 + 44.8
            const fgp = clampStat((ratings.ins ?? 50) - 22 - ppg * 1.7 + L_FG_AVG, 30, 65);

            // ── tpp from tp ────────────────────────────────────────────────
            // Forward: tp = 50 + (tpp - 33.7) * 4.2
            const tpp = clampStat(L_3P_AVG + ((ratings.tp ?? 50) - 50) / 4.2, 15, 48);

            // ── ftp from ft ────────────────────────────────────────────────
            const ftp = clampStat(L_FT_AVG + ((ratings.ft ?? 50) - 50) / 1.4, 40, 95);

            // GP — assume healthy season; durability rating could refine this later.
            const gp = 72;

            return {
                gp,
                min: round1(mpg),
                pts: round1(ppg),
                ast: round1(apg),
                trb: round1(trb),
                stl: round1(stl),
                blk: round1(blk),
                fgp: round1(fgp),
                tpp: round1(tpp),
                ftp: round1(ftp),
            };
        }

        function round1(x) { return Math.round(x * 10) / 10; }

        function processData(data, originalName) {
            status.innerHTML = "Processing...";
            status.className = "status";

            try {
                const players = (data.players || []).map(p => {
                    const r = (p.ratings && p.ratings[0]) || {};
                    const hgtIn = p.hgt || 78;
                    const pos = p.pos || 'GF';
                    const synthStats = calculateStats(r, hgtIn, pos);
                    return {
                        ...p,
                        stats: [{ season: 2026, tid: p.tid ?? -1, ...synthStats }],
                    };
                });

                const out = { ...data, players };
                download(out, `ratingstostats_${originalName}`);
                status.innerHTML = `✅ Synthesized stat lines for ${players.length} players.`;
            } catch (err) {
                showError("Processing failed. Make sure JSON has players[].ratings[0].");
                console.error(err);
            }
        }

        function download(data, filename) {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showError(msg) {
            status.innerHTML = msg;
            status.className = "status error";
        }
    </script>
</body>
</html>
